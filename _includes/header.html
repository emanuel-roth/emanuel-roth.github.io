<header class="header">
  <div class="navigation">

    <a href="{{ '/' | prepend: site.baseurl }}" class="logo">
      {{ site.title }}
    </a>

    <ul class="menu">
      <li class="menu__entry">
        <a href="{{ '/' | prepend: site.baseurl }}">Home</a>
      </li>

      <li class="menu__entry">
        <a href="{{ '/travel.html' | prepend: site.baseurl }}">Travel</a>
      </li>

      <li class="menu__entry">
        <a href="{{ '/seminars.html' | prepend: site.baseurl }}">Seminars</a>
      </li>

      <li class="menu__entry">
        <a href="{{ '/teaching.html' | prepend: site.baseurl }}">Teaching</a>
      </li>

      <li class="menu__entry">
        <a href="#" id="theme-toggle">System Theme</a>
        <script>
          // Set the label before first paint so it doesn't flicker on page load.
          (function () {
            var theme = document.documentElement.getAttribute("data-theme");
            var labels = { light: "Light Theme", dark: "Dark Theme" };
            if (labels[theme]) {
              document.getElementById("theme-toggle").textContent = labels[theme];
            }
          })();
        </script>
      </li>
    </ul>

  </div>
</header>
