<!DOCTYPE html>
<html lang="en">
<head>
<meta name="color-scheme" content="light dark">
<style>
  /* Critical background colours, painted before the external stylesheets load. */
  html { background-color: #ffffff; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    html { background-color: #121212; color-scheme: dark; }
  }
  html[data-theme="light"] { background-color: #ffffff; color-scheme: light; }
  html[data-theme="dark"] { background-color: #121212; color-scheme: dark; }
</style>
<script>
  // Apply the saved theme before first paint to avoid a flash of the wrong theme.
  try {
    var theme = localStorage.getItem("theme");
    if (theme === "light" || theme === "dark") {
      document.documentElement.setAttribute("data-theme", theme);
    }
  } catch (e) {}
</script>
{% include meta_tags/base.html %}
{% include externals/styling.html %}
</head>
<body>
<div class="wrapper">
{% include header.html %}
<main class="page-content">
{{ content }}
</main>
</div>
{% include externals/scripting.html %}
<script src="{{ '/assets/js/theme.js' | prepend: site.baseurl }}"></script>
</body>
</html>
