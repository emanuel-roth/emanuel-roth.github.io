<!DOCTYPE html>
<html lang="en">
<head>
<meta name="color-scheme" content="light dark">
<style>
  /* Critical background colours, painted before the external stylesheets load. */
  html { background-color: #ffffff; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    html { background-color: #121212; color-scheme: dark; }
  }
  html[data-theme="light"] { background-color: #ffffff; color-scheme: light; }
  html[data-theme="dark"] { background-color: #121212; color-scheme: dark; }
</style>
<script>
  // Apply the saved theme before first paint to avoid a flash of the wrong theme.
  try {
    var theme = localStorage.getItem("theme");
    if (theme === "light" || theme === "dark") {
      document.documentElement.setAttribute("data-theme", theme);
    }
  } catch (e) {}
</script>
{% include meta_tags/base.html %}
{% include externals/styling.html %}
</head>
<body>
<div class="wrapper">
{% include header.html %}
<main class="page-content">
{{ content }}
</main>
</div>
{% include externals/scripting.html %}
<script src="{{ '/assets/js/theme.js' | prepend: site.baseurl }}"></script>
<script>
  // Keep the same scroll offset when switching between the menu tabs.
  (function () {
    var key = "tab-scroll";
    document.querySelectorAll(".header a:not(#theme-toggle)").forEach(function (link) {
      link.addEventListener("click", function () {
        try { sessionStorage.setItem(key, String(window.scrollY)); } catch (e) {}
      });
    });
    var y;
    try {
      y = parseInt(sessionStorage.getItem(key), 10);
      sessionStorage.removeItem(key);
    } catch (e) {}
    // Leave anchor links and back/forward/reload to the browser's own handling.
    var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
    if (!y || location.hash || (nav && nav.type !== "navigate")) return;
    // scrollTo clamps to the page height, so a shorter page just stops at its bottom.
    window.scrollTo(0, y);
    // Re-apply after images load, in case they changed the page height.
    window.addEventListener("load", function () { window.scrollTo(0, y); });
  })();
</script>
</body>
</html>
